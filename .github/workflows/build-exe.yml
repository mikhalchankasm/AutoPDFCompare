name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "compare_pdfs.py"
      - "pdfcompare_gui.py"
      - "PDFCompareLocal.spec"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy opencv-python-headless pymupdf

      - name: Build EXE
        run: pyinstaller --noconfirm PDFCompareLocal.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFCompareLocal-windows-build-${{ github.run_number }}
          path: dist/PDFCompareLocal.exe
          if-no-files-found: error

      - name: Publish build prerelease (master)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/PDFCompareLocal.exe
          fail_on_unmatched_files: true
          body: |
            Automated CI build.
            - Build number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}

      - name: Publish version release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/PDFCompareLocal.exe
          fail_on_unmatched_files: true
