name: Build and Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "compare_pdfs.py"
      - "pdfcompare_gui.py"
      - "pdfcompare_core/**"
      - "pdfcompare_ui/**"
      - "packaging/**"
      - "requirements/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-exe.yml"

# Actions are pinned by commit SHA (a mutable tag like @v4 can be repointed at
# any time, which would make a rebuild of the same commit non-reproducible).
# The trailing comment records which tag the SHA belonged to when pinned.

# Default: read-only. Only the build/publish job gets write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          if (-not (Test-Path requirements/lock.txt)) { throw "requirements/lock.txt is missing" }
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/lock.txt

      - name: Lint
        run: .\scripts\lint.ps1

      - name: Test
        run: .\scripts\test.ps1

      - name: Verify clean runtime installation
        shell: pwsh
        run: |
          python -m venv tmp/runtime-check
          if ($LASTEXITCODE -ne 0) { throw "Runtime venv creation failed" }
          $runtimePython = "tmp/runtime-check/Scripts/python.exe"
          & $runtimePython -m pip install --require-hashes -r requirements/lock-runtime.txt
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency installation failed" }
          & $runtimePython scripts/verify_environment.py
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency verification failed" }
          & $runtimePython -c "import scripts.pdfcompare_mcp; import scripts.pdfcompare_worker"
          if ($LASTEXITCODE -ne 0) { throw "Runtime entry point imports failed" }

      # A release must not be produced from a dependency set with a known CVE.
      # The lock is updated before release when the audit reports a fixable issue.
      - name: Audit dependencies
        shell: pwsh
        run: |
          $out = python -m pip_audit --progress-spinner off 2>&1 | Out-String
          $auditExitCode = $LASTEXITCODE
          Write-Output $out
          "## Dependency audit`n`n``````$out```````n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($auditExitCode -ne 0) { throw "Dependency audit failed with exit code $auditExitCode" }

  build:
    runs-on: windows-latest
    needs: test
    # Master pushes run the quality gate; distributables are built for releases
    # and explicit manual requests only.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          if (-not (Test-Path requirements/lock.txt)) { throw "requirements/lock.txt is missing" }
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/lock.txt

      # Two builds on purpose: the standalone download is one file, the installer
      # ships one dir (no %TEMP% extraction, so nothing races with the silent
      # relaunch during an auto-update). Separate workpaths — both are named
      # PDFCompareLocal and would otherwise share build/.
      - name: Build one-file EXE (standalone download)
        run: pyinstaller --noconfirm --workpath build_onefile packaging/PDFCompareLocal.spec

      - name: Build one-dir app (installer payload)
        run: pyinstaller --noconfirm --workpath build_onedir packaging/PDFCompareLocal-dir.spec

      - name: Check the one-dir payload
        shell: pwsh
        run: |
          $exe = "dist/PDFCompareLocal/PDFCompareLocal.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $dll = Get-ChildItem -Path "dist/PDFCompareLocal" -Recurse -Filter "python3*.dll" | Select-Object -First 1
          if (-not $dll) { throw "No python3xx.dll in the one-dir payload" }
          Write-Output "one-dir ok: $exe, runtime: $($dll.FullName)"

      - name: Build portable ZIP
        run: .\scripts\package_portable.ps1

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "from pdfcompare_core.constants import APP_VERSION; print(APP_VERSION)"
          if (-not $version) { throw "Could not read APP_VERSION" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found at $iscc" }
          & $iscc /DAppVersion=$version packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = @(
            "dist/PDFCompareLocal.exe",
            "dist_portable/PDFCompareLocal-portable.zip",
            "dist_installer/PDFCompareLocal-setup.exe"
          )
          $lines = foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing artifact: $f" }
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PDFCompareLocal-windows-build-${{ github.run_number }}
          path: |
            dist/PDFCompareLocal.exe
            dist_portable/PDFCompareLocal-portable.zip
            dist_installer/PDFCompareLocal-setup.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish version release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/PDFCompareLocal.exe
            dist_portable/PDFCompareLocal-portable.zip
            dist_installer/PDFCompareLocal-setup.exe
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
