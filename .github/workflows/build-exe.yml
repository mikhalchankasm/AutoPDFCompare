name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "compare_pdfs.py"
      - "pdfcompare_gui.py"
      - "PDFCompareLocal.spec"
      - "requirements.txt"
      - "run_gui.bat"
      - "run_gui_silent.vbs"
      - "scripts/**"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Lint
        run: .\scripts\lint.ps1

      - name: Test
        run: .\scripts\test.ps1

      - name: Build EXE
        run: pyinstaller --noconfirm PDFCompareLocal.spec

      - name: Build portable ZIP
        run: .\scripts\package_portable.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFCompareLocal-windows-build-${{ github.run_number }}
          path: |
            dist/PDFCompareLocal.exe
            dist_portable/PDFCompareLocal-portable.zip
          if-no-files-found: error

      - name: Publish version release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/PDFCompareLocal.exe
            dist_portable/PDFCompareLocal-portable.zip
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
