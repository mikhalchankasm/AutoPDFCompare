name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "compare_pdfs.py"
      - "pdfcompare_gui.py"
      - "pdfcompare_core/**"
      - "pdfcompare_ui/**"
      - "packaging/**"
      - "requirements/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if (-not (Test-Path requirements/dev.txt)) { throw "requirements/dev.txt is missing" }
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements/dev.txt
          pip install -r requirements/mcp.txt

      - name: Lint
        run: .\scripts\lint.ps1

      - name: Test
        run: .\scripts\test.ps1

      - name: Build EXE
        run: pyinstaller --noconfirm packaging/PDFCompareLocal.spec

      - name: Build portable ZIP
        run: .\scripts\package_portable.ps1

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "from pdfcompare_core.constants import APP_VERSION; print(APP_VERSION)"
          if (-not $version) { throw "Could not read APP_VERSION" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found at $iscc" }
          & $iscc /DAppVersion=$version packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFCompareLocal-windows-build-${{ github.run_number }}
          path: |
            dist/PDFCompareLocal.exe
            dist_portable/PDFCompareLocal-portable.zip
            dist_installer/PDFCompareLocal-setup.exe
          if-no-files-found: error

      - name: Publish version release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/PDFCompareLocal.exe
            dist_portable/PDFCompareLocal-portable.zip
            dist_installer/PDFCompareLocal-setup.exe
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
