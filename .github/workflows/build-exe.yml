name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "compare_pdfs.py"
      - "pdfcompare_gui.py"
      - "PDFCompareLocal.spec"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy opencv-python-headless pymupdf

      - name: Build EXE
        run: pyinstaller --noconfirm PDFCompareLocal.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFCompareLocal-windows
          path: dist/PDFCompareLocal.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDFCompareLocal.exe
          fail_on_unmatched_files: true
