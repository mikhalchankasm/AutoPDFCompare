name: Build and Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "compare_pdfs.py"
      - "pdfcompare_gui.py"
      - "pdfcompare_core/**"
      - "pdfcompare_ui/**"
      - "packaging/**"
      - "requirements/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-exe.yml"

# Actions are pinned by commit SHA (a mutable tag like @v4 can be repointed at
# any time, which would make a rebuild of the same commit non-reproducible).
# The trailing comment records which tag the SHA belonged to when pinned.

# Default: read-only. Only the build/publish job gets write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          if (-not (Test-Path requirements/lock.txt)) { throw "requirements/lock.txt is missing" }
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/lock.txt

      - name: Lint
        run: .\scripts\lint.ps1

      - name: Test
        run: .\scripts\test.ps1

  build:
    runs-on: windows-latest
    needs: test
    # PRs only need the test gate; builds run on master pushes and tags.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          if (-not (Test-Path requirements/lock.txt)) { throw "requirements/lock.txt is missing" }
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/lock.txt

      - name: Build EXE
        run: pyinstaller --noconfirm packaging/PDFCompareLocal.spec

      - name: Build portable ZIP
        run: .\scripts\package_portable.ps1

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "from pdfcompare_core.constants import APP_VERSION; print(APP_VERSION)"
          if (-not $version) { throw "Could not read APP_VERSION" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found at $iscc" }
          & $iscc /DAppVersion=$version packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = @(
            "dist/PDFCompareLocal.exe",
            "dist_portable/PDFCompareLocal-portable.zip",
            "dist_installer/PDFCompareLocal-setup.exe"
          )
          $lines = foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing artifact: $f" }
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)"
          }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PDFCompareLocal-windows-build-${{ github.run_number }}
          path: |
            dist/PDFCompareLocal.exe
            dist_portable/PDFCompareLocal-portable.zip
            dist_installer/PDFCompareLocal-setup.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish version release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Release ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/PDFCompareLocal.exe
            dist_portable/PDFCompareLocal-portable.zip
            dist_installer/PDFCompareLocal-setup.exe
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
